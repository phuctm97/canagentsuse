name: Release
run-name: Release gate for ${{ github.ref_name }} by @${{ github.actor }}

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      reason:
        description: Why are you running the release gate manually?
        required: false
        default: Manual release check

permissions:
  contents: write
  id-token: write
  pull-requests: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "latest"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate main branch
        run: bun run validate:ci

      - name: Summarize validation
        if: always()
        run: |
          {
            echo "## Main validation"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Trigger | \`${GITHUB_EVENT_NAME}\` |"
            echo "| Ref | \`${GITHUB_REF_NAME}\` |"
            echo "| Commit | \`${GITHUB_SHA}\` |"
            echo "| Actor | @${GITHUB_ACTOR} |"
          } >> "$GITHUB_STEP_SUMMARY"

  release:
    name: Plan, Version PR, Publish, And Deploy
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "latest"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Read release plan
        id: plan
        run: bun run release:plan

      - name: Summarize release plan
        env:
          HAS_PLAN: ${{ steps.plan.outputs.has_plan }}
          PACKAGES_JSON: ${{ steps.plan.outputs.packages }}
          CHANGESETS_JSON: ${{ steps.plan.outputs.changesets }}
          MANUAL_REASON: ${{ inputs.reason }}
        run: |
          node <<'NODE'
          const fs = require("node:fs")

          const packages = JSON.parse(process.env.PACKAGES_JSON || "[]")
          const changesets = JSON.parse(process.env.CHANGESETS_JSON || "[]")
          const manualReason = process.env.MANUAL_REASON || ""
          const lines = [
            "## Release plan",
            "",
            "| Field | Value |",
            "| --- | --- |",
            `| Trigger | \`${process.env.GITHUB_EVENT_NAME}\` |`,
            `| Ref | \`${process.env.GITHUB_REF_NAME}\` |`,
            `| Commit | \`${process.env.GITHUB_SHA}\` |`,
            `| Actor | @${process.env.GITHUB_ACTOR} |`,
            `| Changeset plan | ${process.env.HAS_PLAN === "true" ? "yes" : "no"} |`,
            `| Packages | ${packages.length ? packages.map((name) => `\`${name}\``).join(", ") : "none"} |`,
            `| Changesets | ${changesets.length ? changesets.map((name) => `\`${name}\``).join(", ") : "none"} |`,
          ]

          if (manualReason) {
            lines.push(`| Manual reason | ${manualReason.replaceAll("|", "\\|")} |`)
          }

          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `${lines.join("\n")}\n`)
          NODE

      - name: Open or update version packages PR
        if: steps.plan.outputs.has_plan == 'true'
        id: changesets
        continue-on-error: true
        uses: changesets/action@v1
        with:
          github-token: ${{ github.token }}
          version: bun run changeset:version
          title: Version Packages
          commit: Version packages

      - name: Verify version branch fallback
        if: steps.plan.outputs.has_plan == 'true' && steps.changesets.outcome == 'failure'
        id: version_pr_fallback
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_BRANCH: changeset-release/main
          REPOSITORY: ${{ github.repository }}
        run: |
          if ! git ls-remote --exit-code origin "refs/heads/${RELEASE_BRANCH}" >/dev/null; then
            echo "changesets/action failed before pushing ${RELEASE_BRANCH}."
            exit 1
          fi

          pr_json="$(gh pr list --state open --head "${RELEASE_BRANCH}" --json number,url --jq '.[0] // empty' || true)"
          if [ -n "$pr_json" ]; then
            echo "number=$(printf '%s' "$pr_json" | node -e 'let s=\"\";process.stdin.on(\"data\",d=>s+=d);process.stdin.on(\"end\",()=>console.log(JSON.parse(s).number))')" >> "$GITHUB_OUTPUT"
            echo "url=$(printf '%s' "$pr_json" | node -e 'let s=\"\";process.stdin.on(\"data\",d=>s+=d);process.stdin.on(\"end\",()=>console.log(JSON.parse(s).url))')" >> "$GITHUB_OUTPUT"
          else
            echo "manual_url=https://github.com/${REPOSITORY}/pull/new/${RELEASE_BRANCH}" >> "$GITHUB_OUTPUT"
          fi

      - name: Detect merged version release
        if: steps.plan.outputs.has_plan != 'true'
        id: versioned
        run: bun run release:detect-version

      - name: Stop when no release is needed
        if: steps.plan.outputs.has_plan != 'true' && steps.versioned.outputs.has_release != 'true'
        run: echo "No changesets or merged version package changes found."

      - name: Validate version release
        if: steps.versioned.outputs.has_release == 'true'
        run: bun run validate

      - name: Publish CLI package
        if: steps.versioned.outputs.cli == 'true'
        env:
          NPM_CONFIG_ACCESS: public
          NPM_CONFIG_PROVENANCE: "true"
        run: bun run changeset:publish

      - name: Check Vercel secrets
        if: steps.versioned.outputs.website == 'true'
        id: vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          if [ -n "$VERCEL_TOKEN" ] && [ -n "$VERCEL_ORG_ID" ] && [ -n "$VERCEL_PROJECT_ID" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Vercel secrets are not fully configured. The pushed version commit can still deploy through Vercel Git integration."
          fi

      - name: Deploy website to Vercel
        if: steps.versioned.outputs.website == 'true' && steps.vercel.outputs.configured == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          bunx vercel pull --yes --environment=production --token "$VERCEL_TOKEN"
          bunx vercel build --prod --token "$VERCEL_TOKEN"
          bunx vercel deploy --prebuilt --prod --archive=tgz --token "$VERCEL_TOKEN"

      - name: Push package tags
        if: steps.versioned.outputs.has_release == 'true'
        run: git push origin --tags

      - name: Create GitHub release
        if: steps.versioned.outputs.cli == 'true'
        id: github_release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="canagentsuse@${{ steps.versioned.outputs.cli_version }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            url="$(gh release view "$tag" --json url --jq .url)"
          else
            url="$(gh release create "$tag" --title "$tag" --generate-notes --latest)"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Summarize release result
        if: steps.plan.outputs.has_plan == 'true' || steps.versioned.outputs.has_release == 'true'
        env:
          HAS_PLAN: ${{ steps.plan.outputs.has_plan }}
          VERSION_PR: ${{ steps.changesets.outputs.pullRequestNumber }}
          VERSION_PR_OUTCOME: ${{ steps.changesets.outcome }}
          FALLBACK_VERSION_PR: ${{ steps.version_pr_fallback.outputs.number }}
          FALLBACK_VERSION_PR_URL: ${{ steps.version_pr_fallback.outputs.url }}
          FALLBACK_MANUAL_URL: ${{ steps.version_pr_fallback.outputs.manual_url }}
          HAS_RELEASE: ${{ steps.versioned.outputs.has_release }}
          CLI_RELEASE: ${{ steps.versioned.outputs.cli }}
          CLI_VERSION: ${{ steps.versioned.outputs.cli_version }}
          WEBSITE_RELEASE: ${{ steps.versioned.outputs.website }}
          WEBSITE_VERSION: ${{ steps.versioned.outputs.website_version }}
          GITHUB_RELEASE_URL: ${{ steps.github_release.outputs.url }}
          VERCEL_CONFIGURED: ${{ steps.vercel.outputs.configured }}
        run: |
          node <<'NODE'
          const fs = require("node:fs")

          const lines = ["", "## Release result", ""]

          if (process.env.HAS_PLAN === "true") {
            if (process.env.VERSION_PR) {
              lines.push("A Version Packages PR was opened or updated.")
              lines.push(`- Version PR: #${process.env.VERSION_PR}`)
            } else if (process.env.FALLBACK_VERSION_PR) {
              lines.push("A Version Packages branch was pushed and an existing PR is available.")
              lines.push(`- Version PR: #${process.env.FALLBACK_VERSION_PR}`)
              if (process.env.FALLBACK_VERSION_PR_URL) {
                lines.push(`- Version PR URL: ${process.env.FALLBACK_VERSION_PR_URL}`)
              }
            } else if (process.env.FALLBACK_MANUAL_URL) {
              lines.push("A Version Packages branch was pushed, but this repository does not allow GitHub Actions to create pull requests.")
              lines.push(`- Open the version PR manually: ${process.env.FALLBACK_MANUAL_URL}`)
            } else if (process.env.VERSION_PR_OUTCOME === "failure") {
              lines.push("Version Packages PR creation failed before a fallback branch could be verified.")
            }
          } else if (process.env.HAS_RELEASE === "true") {
            lines.push("Merged version package changes were released.")
            lines.push(`- CLI publish: ${process.env.CLI_RELEASE === "true" ? `canagentsuse@${process.env.CLI_VERSION}` : "not needed"}`)
            lines.push(`- Website deploy: ${process.env.WEBSITE_RELEASE === "true" ? `@canagentsuse/website@${process.env.WEBSITE_VERSION}` : "not needed"}`)
            if (process.env.WEBSITE_RELEASE === "true") {
              lines.push(`- Vercel secrets configured: ${process.env.VERCEL_CONFIGURED === "true" ? "yes" : "no"}`)
            }
            if (process.env.GITHUB_RELEASE_URL) {
              lines.push(`- GitHub Release: ${process.env.GITHUB_RELEASE_URL}`)
            }
          }

          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `${lines.join("\n")}\n`)
          NODE
