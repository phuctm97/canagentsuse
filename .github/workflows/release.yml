name: Release
run-name: Release

on:
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  id-token: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  preflight:
    name: Require Latest Main Validation
    runs-on: ubuntu-latest
    steps:
      - name: Require release from main
        run: |
          if [ "$GITHUB_REF_NAME" != "main" ]; then
            echo "Release must be triggered from the main branch, not ${GITHUB_REF_NAME}."
            exit 1
          fi

      - name: Require latest successful main validation
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          gh api --method GET "repos/${GITHUB_REPOSITORY}/actions/workflows/main-validate.yml/runs" \
            -f branch=main \
            -f status=completed \
            -F per_page=1 > /tmp/main-validate-run.json

          node <<'NODE'
          const fs = require("node:fs")

          const payload = JSON.parse(fs.readFileSync("/tmp/main-validate-run.json", "utf8"))
          const run = payload.workflow_runs?.[0]
          const lines = [
            "## Release preflight",
            "",
            "| Field | Value |",
            "| --- | --- |",
            `| Release commit | \`${process.env.RELEASE_SHA}\` |`,
          ]

          if (!run) {
            lines.push("| Main validation | missing |")
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `${lines.join("\n")}\n`)
            console.error("No completed Main Validate run exists for main. Wait for the main validation workflow to finish before releasing.")
            process.exit(1)
          }

          lines.push(`| Latest validation commit | \`${run.head_sha}\` |`)
          lines.push(`| Latest validation conclusion | ${run.conclusion || "unknown"} |`)
          lines.push(`| Latest validation run | ${run.html_url} |`)
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `${lines.join("\n")}\n`)

          if (run.head_sha !== process.env.RELEASE_SHA) {
            console.error(
              `Latest completed Main Validate run is for ${run.head_sha}, but this release is for ${process.env.RELEASE_SHA}. Wait for validation on the current main commit before releasing.`
            )
            process.exit(1)
          }

          if (run.conclusion !== "success") {
            console.error(`Latest Main Validate run for main concluded with ${run.conclusion}. Release rejected.`)
            process.exit(1)
          }
          NODE

  validate:
    name: Validate
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "latest"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate main branch
        run: bun run validate:ci

      - name: Summarize validation
        if: always()
        run: |
          {
            echo "## Main validation"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Trigger | \`${GITHUB_EVENT_NAME}\` |"
            echo "| Ref | \`${GITHUB_REF_NAME}\` |"
            echo "| Commit | \`${GITHUB_SHA}\` |"
            echo "| Actor | @${GITHUB_ACTOR} |"
          } >> "$GITHUB_STEP_SUMMARY"

  release:
    name: Plan, Version, Publish, And Deploy
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "latest"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Read release plan
        id: plan
        run: bun run release:plan

      - name: Summarize release plan
        env:
          HAS_PLAN: ${{ steps.plan.outputs.has_plan }}
          PACKAGES_JSON: ${{ steps.plan.outputs.packages }}
          CHANGESETS_JSON: ${{ steps.plan.outputs.changesets }}
        run: |
          node <<'NODE'
          const fs = require("node:fs")

          const packages = JSON.parse(process.env.PACKAGES_JSON || "[]")
          const changesets = JSON.parse(process.env.CHANGESETS_JSON || "[]")
          const lines = [
            "## Release plan",
            "",
            "| Field | Value |",
            "| --- | --- |",
            `| Trigger | \`${process.env.GITHUB_EVENT_NAME}\` |`,
            `| Ref | \`${process.env.GITHUB_REF_NAME}\` |`,
            `| Commit | \`${process.env.GITHUB_SHA}\` |`,
            `| Actor | @${process.env.GITHUB_ACTOR} |`,
            `| Changeset plan | ${process.env.HAS_PLAN === "true" ? "yes" : "no"} |`,
            `| Packages | ${packages.length ? packages.map((name) => `\`${name}\``).join(", ") : "none"} |`,
            `| Changesets | ${changesets.length ? changesets.map((name) => `\`${name}\``).join(", ") : "none"} |`,
          ]

          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `${lines.join("\n")}\n`)
          NODE

      - name: Commit version package changes
        if: steps.plan.outputs.has_plan == 'true'
        id: version_commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          bun run changeset:version

          if git diff --quiet; then
            echo "committed=false" >> "$GITHUB_OUTPUT"
            echo "No version package changes were produced."
            exit 0
          fi

          git add .
          git commit -m "Version packages"
          git push origin HEAD:main
          echo "committed=true" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Detect merged version release
        if: steps.plan.outputs.has_plan != 'true' || steps.version_commit.outputs.committed == 'true'
        id: versioned
        run: bun run release:detect-version

      - name: Stop when no release is needed
        if: steps.versioned.outputs.has_release != 'true'
        run: echo "No changesets or merged version package changes found."

      - name: Validate version release
        if: steps.versioned.outputs.has_release == 'true'
        run: bun run validate

      - name: Publish CLI package
        if: steps.versioned.outputs.cli == 'true'
        env:
          NPM_CONFIG_ACCESS: public
          NPM_CONFIG_PROVENANCE: "true"
        run: bun run changeset:publish

      - name: Check Vercel secrets
        if: steps.versioned.outputs.website == 'true'
        id: vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          if [ -n "$VERCEL_TOKEN" ] && [ -n "$VERCEL_ORG_ID" ] && [ -n "$VERCEL_PROJECT_ID" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Vercel secrets are not fully configured. The pushed version commit can still deploy through Vercel Git integration."
          fi

      - name: Deploy website to Vercel
        if: steps.versioned.outputs.website == 'true' && steps.vercel.outputs.configured == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          bunx vercel pull --yes --environment=production --token "$VERCEL_TOKEN"
          bunx vercel build --prod --token "$VERCEL_TOKEN"
          bunx vercel deploy --prebuilt --prod --archive=tgz --token "$VERCEL_TOKEN"

      - name: Push package tags
        if: steps.versioned.outputs.has_release == 'true'
        run: git push origin --tags

      - name: Create GitHub release
        if: steps.versioned.outputs.cli == 'true'
        id: github_release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="canagentsuse@${{ steps.versioned.outputs.cli_version }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            url="$(gh release view "$tag" --json url --jq .url)"
          else
            url="$(gh release create "$tag" --title "$tag" --generate-notes --latest)"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Dispatch post-release main validation
        if: steps.version_commit.outputs.committed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run main-validate.yml --ref main

      - name: Summarize release result
        if: steps.plan.outputs.has_plan == 'true' || steps.versioned.outputs.has_release == 'true'
        env:
          HAS_PLAN: ${{ steps.plan.outputs.has_plan }}
          VERSION_COMMITTED: ${{ steps.version_commit.outputs.committed }}
          VERSION_COMMIT_SHA: ${{ steps.version_commit.outputs.sha }}
          HAS_RELEASE: ${{ steps.versioned.outputs.has_release }}
          CLI_RELEASE: ${{ steps.versioned.outputs.cli }}
          CLI_VERSION: ${{ steps.versioned.outputs.cli_version }}
          WEBSITE_RELEASE: ${{ steps.versioned.outputs.website }}
          WEBSITE_VERSION: ${{ steps.versioned.outputs.website_version }}
          GITHUB_RELEASE_URL: ${{ steps.github_release.outputs.url }}
          VERCEL_CONFIGURED: ${{ steps.vercel.outputs.configured }}
        run: |
          node <<'NODE'
          const fs = require("node:fs")

          const lines = ["", "## Release result", ""]

          if (process.env.HAS_PLAN === "true") {
            lines.push("Changeset version package changes were committed directly to `main`.")
            lines.push(`- Version commit created: ${process.env.VERSION_COMMITTED === "true" ? "yes" : "no"}`)
            if (process.env.VERSION_COMMIT_SHA) {
              lines.push(`- Version commit: \`${process.env.VERSION_COMMIT_SHA}\``)
            }
            lines.push("- The release gate continues from the version commit in this workflow run.")
          } else if (process.env.HAS_RELEASE === "true") {
            lines.push("Merged version package changes were released.")
            lines.push(`- CLI publish: ${process.env.CLI_RELEASE === "true" ? `canagentsuse@${process.env.CLI_VERSION}` : "not needed"}`)
            lines.push(`- Website deploy: ${process.env.WEBSITE_RELEASE === "true" ? `@canagentsuse/website@${process.env.WEBSITE_VERSION}` : "not needed"}`)
            if (process.env.WEBSITE_RELEASE === "true") {
              lines.push(`- Vercel secrets configured: ${process.env.VERCEL_CONFIGURED === "true" ? "yes" : "no"}`)
            }
            if (process.env.GITHUB_RELEASE_URL) {
              lines.push(`- GitHub Release: ${process.env.GITHUB_RELEASE_URL}`)
            }
          }

          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `${lines.join("\n")}\n`)
          NODE
