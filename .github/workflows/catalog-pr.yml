name: PR Validate
run-name: "PR #${{ github.event.pull_request.number }}: ${{ github.event.pull_request.title }}"

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: catalog-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Pull Request
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "latest"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate catalog PR shape
        run: bun run catalog:pr:check

      - name: Validate pull request
        run: bun run validate:ci

      - name: Summarize pull request validation
        if: always()
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_HEAD: ${{ github.event.pull_request.head.ref }}
          PR_BASE: ${{ github.event.pull_request.base.ref }}
        run: |
          node <<'NODE'
          const fs = require("node:fs")
          const escapeCell = (value) => String(value || "").replaceAll("|", "\\|")
          const lines = [
            "## Pull request validation",
            "",
            "| Field | Value |",
            "| --- | --- |",
            `| PR | #${escapeCell(process.env.PR_NUMBER)} |`,
            `| Title | ${escapeCell(process.env.PR_TITLE)} |`,
            `| Author | @${escapeCell(process.env.PR_AUTHOR)} |`,
            `| Head | \`${escapeCell(process.env.PR_HEAD)}\` |`,
            `| Base | \`${escapeCell(process.env.PR_BASE)}\` |`,
            `| Commit | \`${process.env.GITHUB_SHA}\` |`,
          ]

          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `${lines.join("\n")}\n`)
          NODE
