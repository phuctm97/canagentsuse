name: Main Validate
run-name: "Validate main at ${{ github.sha }}"

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: main-validate-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Main
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "latest"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate main branch
        run: bun run validate:ci

      - name: Summarize main validation
        if: always()
        run: |
          {
            echo "## Main validation"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Trigger | \`${GITHUB_EVENT_NAME}\` |"
            echo "| Ref | \`${GITHUB_REF_NAME}\` |"
            echo "| Commit | \`${GITHUB_SHA}\` |"
            echo "| Actor | @${GITHUB_ACTOR} |"
          } >> "$GITHUB_STEP_SUMMARY"
